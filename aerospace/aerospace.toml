config-version = 2
persistent-workspaces = ["1", "2", "3"] # "E"

default-root-container-layout = "accordion"
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 0
automatically-unhide-macos-hidden-apps = true

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

after-startup-command = [
  'exec-and-forget open -a "Alacritty"'
]

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
# E = 'secondary'

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'layout floating'
[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'layout floating'
[[on-window-detected]]
if.app-id = 'com.apple.reminders'
run = 'layout floating'
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'
[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'
[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = 'layout floating'
[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = 'layout floating'
[[on-window-detected]]
if.app-name-regex-substring = 'mpv'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.alacritty'
run = ['layout accordion', 'move-node-to-workspace 1']
[[on-window-detected]]
if.app-id = 'info.sioyek.sioyek'
run = ['fullscreen on', 'move-node-to-workspace 2']
[[on-window-detected]]
if.app-id = 'net.imput.helium'
run = 'move-node-to-workspace 2'
[[on-window-detected]]
if = 'test %{app-bundle-id} ~= jetbrains'
run = 'move-node-to-workspace 3'
[[on-window-detected]]
if.app-id = 'org.libreoffice.script'
run = 'move-node-to-workspace 3'
[[on-window-detected]]
if.app-id = 'org.greenfoot.Greenfoot'
run = 'move-node-to-workspace 3'
[[on-window-detected]]
if.app-name-regex-substring = '(?i)neovide'
run = ['fullscreen on', 'move-node-to-workspace 3']

[mode.main.binding]
# Terminal-"tabs" = losse Alacritty-vensters: cmd-n maakt er een, de accordion
# op workspace 1 stapelt ze, h/l bladert. Bewust geen tmux en geen picker.
alt-ctrl-cmd-h = 'focus left'
alt-ctrl-cmd-j = 'focus down'
alt-ctrl-cmd-k = 'focus up'
alt-ctrl-cmd-l = 'focus right'

alt-ctrl-cmd-1 = 'workspace 1'
alt-ctrl-cmd-2 = 'workspace 2'
alt-ctrl-cmd-3 = 'workspace 3'
# alt-ctrl-cmd-e = 'workspace E'

alt-ctrl-cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-ctrl-cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-ctrl-cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
# alt-ctrl-cmd-shift-e = 'move-node-to-workspace --focus-follows-window E'

alt-ctrl-cmd-shift-f = 'layout floating tiling'
alt-ctrl-cmd-a = 'layout accordion'
alt-ctrl-cmd-enter = 'fullscreen'

alt-ctrl-cmd-s = 'exec-and-forget open -a Helium'
alt-ctrl-cmd-t = 'exec-and-forget open -a Alacritty'
alt-ctrl-cmd-f = 'exec-and-forget open -a Finder'
