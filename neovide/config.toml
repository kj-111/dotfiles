fork = true
frame = "none"
maximized = true
tabs = false
# Globale hotkeys ⌘⌃Z (pinned window) en ⌘⌃N (editors switcher); leeg = uit.
system-pinned-hotkey = ""
system-switcher-hotkey = ""
system-tab-prev-hotkey = ""
system-tab-next-hotkey = ""

# Gelijk aan alacritty.toml: zelfde familie, faces en grootte.
[font]
normal = { family = "MonaspiceNe Nerd Font Mono", style = "Regular" }
bold = { family = "MonaspiceNe Nerd Font Mono", style = "Bold" }
italic = { family = "MonaspiceNe Nerd Font Mono", style = "Italic" }
bold_italic = { family = "MonaspiceNe Nerd Font Mono", style = "Bold Italic" }
size = 15.5
# Eén pixel extra letterruimte, zoals font.offset.x in alacritty.toml. Neovide
# rondt de celbreedte niet af (font_width = glyph_advance + width), dus 19.22
# wordt hier 20.22; alacritty komt met zijn floor op precies 20.
width = 1

# calt = Monaspace's texture healing, liga = ligaturen; alleen Neovide past ze toe.
[font.features]
"MonaspiceNe Nerd Font Mono" = ["-liga", "+calt"]
