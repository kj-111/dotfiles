# Uitleg bij deze keuzes: nvim/docs/lsp.md
#
# Werkt alleen via een symlink, want clangd leest op macOS uit
# ~/Library/Preferences/clangd/ en niet uit ~/.config:
#     ln -s ~/.config/clangd ~/Library/Preferences/clangd

If:
  PathMatch: .*\.(c|h)$
CompileFlags:
  Add:
    - -xc
    - -std=c23
    - -Wall
    - -Wextra

---
Diagnostics:
  ClangTidy:
    Add:
      - bugprone-*
      - clang-analyzer-*
      - misc-*
      - readability-*
    Remove:
      - bugprone-easily-swappable-parameters
      - readability-magic-numbers
      - readability-identifier-length
